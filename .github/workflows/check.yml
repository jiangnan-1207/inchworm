name: Standard-library checks
on: [push, pull_request]
jobs:
  alignment-judge-imports:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        judge: [dpg, tiif]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pip==24.0 setuptools==69.5.1 wheel==0.45.1
      - if: matrix.judge == 'dpg'
        run: python -m pip install torch==2.0.1 torchvision==0.15.2 torchaudio==2.0.2 --index-url https://download.pytorch.org/whl/cpu
      - if: matrix.judge == 'tiif'
        run: python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/alignment-${{ matrix.judge }}.txt
      - run: python -m pip check
      - if: matrix.judge == 'dpg'
        run: python -c "import importlib.util; from modelscope.models.multi_modal.mplug import MPlug, MPlugConfig; from mplug_direct import MPlugDirect; assert importlib.util.find_spec('fairseq') is None; print('MPLUG_CPU_IMPORT_WITHOUT_FAIRSEQ_OK')"
      - if: matrix.judge == 'tiif'
        run: python -c "from transformers import Qwen2_5_VLForConditionalGeneration, AutoProcessor; from paddleocr import PaddleOCR; print('TIIF_CPU_IMPORT_OK')"
  alignment-datasets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/checkout@v4
        with:
          repository: TencentQQGYLab/ELLA
          ref: 3c228f1dc6c4d3cad0a47493816151a419f14db3
          path: benchmarks/ELLA
      - uses: actions/checkout@v4
        with:
          repository: A113N-W3I/TIIF-Bench
          ref: cca586f40f057c1590d819ae3807ea4e27620e84
          path: benchmarks/TIIF-Bench
      - run: python -m unittest discover -s tests -p 'test_alignment.py' -v
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q .
      - run: for file in scripts/*.sh configs/example.sh; do bash -n "$file"; done
  tensor-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/checkout@v4
        with:
          repository: FoundationVision/LlamaGen
          ref: ce98ec41803a74a90ce68c40ababa9eaeffeb4ec
          path: benchmarks/LlamaGen
      - run: python -m unittest discover -s tests -v
  lumina-cache-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/lumina.txt
      - uses: actions/checkout@v4
        with:
          repository: Alpha-VLLM/Lumina-mGPT-2.0
          ref: 0a54b9e0f1bf4ea3577e8a3b1b27b652fbc1e6cc
          path: benchmarks/Lumina-mGPT-2.0
      - run: PYTHONPATH=benchmarks/Lumina-mGPT-2.0/lumina_mgpt:benchmarks/Lumina-mGPT-2.0 python -c "from inference_solver import FlexARInferenceSolver; print('LUMINA_CPU_IMPORT_OK')"
      - run: python -m unittest discover -s tests -p 'test_lumina*.py' -v
